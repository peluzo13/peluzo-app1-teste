<style>
/* Layout: single-column phone app, fixed bottom tab bar, one dark "candlelit stone" world. */
:root {
  --bg: #0c0e13;
  --surface: #151922;
  --surface-2: #1d2230;
  --line: #2a3142;
  --fg: #ecebe4;
  --muted: #8e95a6;
  --gold: #e4b35c;
  --gold-soft: rgba(228,179,92,.14);
  --danger: #e2705f;
  --danger-soft: rgba(226,112,95,.14);
  --ok: #82c79f;
  --font-display: "Bricolage Grotesque", "Space Grotesk", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-verse: "Literata", Georgia, "Times New Roman", serif;
  --radius: 18px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body {
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px calc(96px + env(safe-area-inset-bottom, 0px));
  -webkit-tap-highlight-color: transparent;
}
main { max-width: 520px; margin: 0 auto; display: grid; gap: 16px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 28px; font-weight: 800; }
h2 { font-size: 20px; font-weight: 700; }
h3 { font-size: 16px; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.eyebrow { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
input, textarea {
  font: inherit; color: var(--fg); background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 12px; padding: 12px; width: 100%;
}
textarea { min-height: 96px; resize: vertical; }
.card { background: var(--surface); border-radius: var(--radius); padding: 18px; display: grid; gap: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; justify-content: space-between; align-items: center; gap: 10px; }

.btn { border-radius: 999px; padding: 12px 20px; font-weight: 600; background: var(--surface-2); }
.btn.primary { background: var(--gold); color: #1a1408; }
.btn.danger { background: var(--danger-soft); color: var(--danger); }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.btn.block { width: 100%; }
.chip { border-radius: 999px; padding: 7px 13px; font-size: 13px; background: var(--surface-2); border: 1px solid var(--line); }
.chip[aria-pressed="true"] { background: var(--gold-soft); border-color: var(--gold); color: var(--gold); }

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; padding-top: 4px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { width: 34px; height: 34px; }
.brand b { font-family: var(--font-display); font-size: 20px; font-weight: 800; }

/* Streak hero */
.hero { position: relative; display: grid; place-items: center; padding: 8px 0 4px; }
.ring { width: min(78vw, 300px); max-width: 100%; aspect-ratio: 1; }
.ring circle { fill: none; stroke-width: 10; }
.ring .track { stroke: var(--surface-2); }
.ring .prog { stroke: var(--gold); stroke-linecap: round; transition: stroke-dashoffset .8s ease; }
.hero-inner { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 2px; }
.days { font-family: var(--font-display); font-weight: 800; font-size: clamp(64px, 22vw, 96px); line-height: .95; font-variant-numeric: tabular-nums; }
.clock { font-family: var(--font-display); font-weight: 500; font-size: 20px; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.next { text-align: center; color: var(--muted); font-size: 14px; }
.next b { color: var(--gold); font-weight: 600; }

.sos-btn {
  width: 100%; border-radius: var(--radius); padding: 18px; background: var(--danger); color: #1c0905;
  font-family: var(--font-display); font-weight: 800; font-size: 19px; display: flex; align-items: center; justify-content: center; gap: 10px;
}
.sos-btn small { display: block; font-family: var(--font-body); font-weight: 500; font-size: 13px; opacity: .8; }

.verse { font-family: var(--font-verse); font-style: italic; font-size: 17px; line-height: 1.55; }
.ref { font-size: 13px; color: var(--gold); font-weight: 600; }

.stats { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.stat { background: var(--surface-2); border-radius: 14px; padding: 14px; display: grid; gap: 2px; }
.stat b { font-family: var(--font-display); font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }

/* Challenge */
.wall { background: #262b36; border-radius: var(--radius); padding: 20px 18px; display: grid; gap: 14px;
  background-image: repeating-linear-gradient(0deg, transparent 0 30px, rgba(0,0,0,.18) 30px 32px),
                    repeating-linear-gradient(90deg, transparent 0 62px, rgba(0,0,0,.14) 62px 64px); }
.tally { display: flex; flex-wrap: wrap; gap: 12px 14px; min-height: 46px; align-items: center; }
.tally svg { height: 42px; width: auto; }
.tally path { stroke: #f1efe6; stroke-width: 3.2; stroke-linecap: round; fill: none; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 6px; }
.cal .dow { font-size: 11px; text-align: center; color: var(--muted); font-weight: 600; }
.cal .d { aspect-ratio: 1; border-radius: 10px; display: grid; place-items: center; font-size: 13px; font-variant-numeric: tabular-nums; background: var(--surface-2); color: var(--muted); }
.cal .d.clean { background: var(--gold-soft); color: var(--gold); font-weight: 700; }
.cal .d.fail { background: var(--danger-soft); color: var(--danger); font-weight: 700; text-decoration: line-through; }
.cal .d.today { outline: 2px solid var(--gold); outline-offset: -2px; color: var(--fg); font-weight: 700; }
.cal .d.before, .cal .d.future { opacity: .45; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* Lists */
.list { display: grid; gap: 10px; }
.entry { background: var(--surface-2); border-radius: 14px; padding: 14px; display: grid; gap: 6px; min-width: 0; }
.entry p { white-space: pre-wrap; overflow-wrap: anywhere; }
.entry .meta { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--surface); color: var(--muted); }
.tag.fail { color: var(--danger); background: var(--danger-soft); }
.tag.win { color: var(--ok); background: rgba(130,199,159,.14); }
.del { color: var(--muted); font-size: 12px; text-decoration: underline; }

.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }
.badge { background: var(--surface-2); border-radius: 14px; padding: 12px 8px; text-align: center; display: grid; gap: 4px; opacity: .4; }
.badge.got { opacity: 1; background: var(--gold-soft); }
.badge b { font-family: var(--font-display); font-size: 22px; font-weight: 800; color: var(--gold); }
.badge span { font-size: 11px; color: var(--muted); }

.reason { display: flex; gap: 10px; align-items: flex-start; }
.reason p { flex: 1; min-width: 0; overflow-wrap: anywhere; }

.banner { background: var(--gold-soft); border: 1px solid rgba(228,179,92,.4); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }

/* Incentivo */
.feature { background: linear-gradient(160deg, #2a2418, var(--surface) 70%); border: 1px solid rgba(228,179,92,.3); }
.res { background: var(--surface); border-radius: 14px; padding: 14px; display: grid; gap: 8px; min-width: 0; }
.res h3 { font-size: 15px; }
.res .who { font-size: 13px; color: var(--gold); font-weight: 600; }
.res p { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.res .acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.link { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 8px 14px; background: var(--gold); color: #1a1408; font-weight: 600; font-size: 13px; text-decoration: none; }
.link.spot { background: #1db954; color: #04140a; }
.res.seen { opacity: .6; }
.daily { display: flex; gap: 12px; align-items: flex-start; }
.daily .box { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--gold); flex: none; display: grid; place-items: center; margin-top: 2px; }
.daily[aria-pressed="true"] .box { background: var(--gold); }
.daily[aria-pressed="true"] .box::after { content: ""; width: 10px; height: 6px; border-left: 2.5px solid #1a1408; border-bottom: 2.5px solid #1a1408; transform: rotate(-45deg) translate(1px,-1px); }
.daily { text-align: left; width: 100%; }

/* Bíblia */
.bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--gold); border-radius: 999px; }
.bar.thin { height: 4px; }
.big-pct { font-family: var(--font-display); font-size: 44px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.books { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.book { background: var(--surface); border-radius: 12px; padding: 11px 12px; display: grid; gap: 6px; text-align: left; min-width: 0; }
.book b { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.book small { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.book.done b { color: var(--gold); }
.chs { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 8px; }
.chs button { aspect-ratio: 1; border-radius: 12px; background: var(--surface); font-variant-numeric: tabular-nums; font-weight: 600; }
.chs button.read { background: var(--gold-soft); color: var(--gold); }
.chs button.last { outline: 2px solid var(--gold); outline-offset: -2px; }
.reader { font-family: var(--font-verse); font-style: normal; font-size: 18px; line-height: 1.75; }
.reader .v { cursor: pointer; border-radius: 4px; padding: 1px 0; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.reader .v sup { font-family: var(--font-body); font-size: 11px; color: var(--muted); font-weight: 600; margin: 0 3px 0 2px; }
.reader .v.mk { background: var(--gold-soft); box-shadow: inset 0 -2px 0 var(--gold); }
.reader .v.mk sup { color: var(--gold); }
.navrow { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; }
.back { color: var(--muted); font-size: 14px; padding: 6px 0; justify-self: start; text-align: left; }
.mark-item { background: var(--surface); border-radius: 14px; padding: 14px; display: grid; gap: 6px; text-align: left; width: 100%; }
.mark-item .verse { font-size: 16px; }

.plan-card { background: var(--surface); border-radius: 14px; padding: 14px; display: grid; gap: 8px; }
.plan-card h3 { font-size: 16px; }
.plan-card .meta { font-size: 12px; color: var(--muted); }
.reads { display: grid; gap: 6px; }
.read-item { display: flex; gap: 10px; align-items: center; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; text-align: left; width: 100%; font-size: 15px; }
.read-item .box { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--line); flex: none; }
.read-item.ok { color: var(--muted); }
.read-item.ok .box { background: var(--ok); border-color: var(--ok); }
.read-item span:last-child { margin-left: auto; color: var(--muted); font-size: 13px; }
.day-row { display: grid; gap: 6px; }
.day-row .spread b { font-size: 14px; }
.devo .verse { font-size: 17px; }
.devo h4 { margin: 0; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.devo .body { font-size: 16px; line-height: 1.65; }

.cal .d { position: relative; }
.cal .d.bib::after, .cal .d.dv::before { content: ""; position: absolute; bottom: 4px; left: 50%; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; }
.cal .d.bib::after { background: var(--fg); }
.cal .d.dv::before { background: var(--gold); box-shadow: 0 0 0 1px var(--bg); }
.cal .d.bib.dv::after { margin-left: -6.5px; }
.cal .d.bib.dv::before { margin-left: 1.5px; }
.devo-row { display: flex; gap: 10px; align-items: baseline; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; text-align: left; width: 100%; }
.devo-row small { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; width: 44px; }
.devo-row span { flex: 1; min-width: 0; }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--muted); font-size: 9px; font-family: var(--font-body); font-variant-numeric: tabular-nums; }
.chart .bar-m { fill: var(--gold); pointer-events: none; }
.chart .bar-m.today { fill: var(--fg); }
.chart .devo-dot { fill: var(--gold); pointer-events: none; }
.chart .hit { fill: transparent; cursor: pointer; }
.chart .hit:hover + .bar-m, .chart .sel { opacity: .75; }
.chart-tip { font-size: 13px; color: var(--muted); min-height: 20px; font-variant-numeric: tabular-nums; }
.chart-tip b { color: var(--fg); font-weight: 600; }

/* Tab bar */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: rgba(17,20,27,.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
nav.tabs .inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); }
nav.tabs a { display: grid; justify-items: center; gap: 3px; font-size: 10.5px; white-space: nowrap; color: var(--muted); text-decoration: none; padding: 4px 0; font-weight: 500; }
nav.tabs a svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs a[aria-current="page"] { color: var(--gold); }

/* Sheets & SOS overlay */
.overlay { position: fixed; inset: 0; z-index: 40; background: rgba(5,6,9,.7); display: grid; align-items: end; }
.sheet {
  background: var(--surface); border-radius: 24px 24px 0 0; max-height: 92vh; overflow-y: auto;
  padding: 22px max(18px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  display: grid; gap: 14px; width: 100%; max-width: 560px; margin: 0 auto;
}
.sos { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto;
  padding: calc(18px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sos .wrap { max-width: 520px; margin: 0 auto; display: grid; gap: 18px; }
.breath { display: grid; place-items: center; padding: 10px 0; }
.breath .orb { width: 190px; height: 190px; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 50% 40%, rgba(228,179,92,.45), rgba(228,179,92,.08) 70%);
  border: 1px solid rgba(228,179,92,.5); transform: scale(.62); transition-property: transform; transition-timing-function: ease-in-out; }
.breath .orb span { font-family: var(--font-display); font-weight: 700; font-size: 22px; }
.steps { display: grid; gap: 8px; }
.step { display: flex; gap: 12px; align-items: center; background: var(--surface); border-radius: 14px; padding: 12px 14px; text-align: left; width: 100%; }
.step .box { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--line); flex: none; display: grid; place-items: center; }
.step[aria-pressed="true"] .box { background: var(--ok); border-color: var(--ok); }
.step[aria-pressed="true"] .box::after { content: ""; width: 9px; height: 5px; border-left: 2px solid #0c0e13; border-bottom: 2px solid #0c0e13; transform: rotate(-45deg) translate(1px,-1px); }
.timer { font-family: var(--font-display); font-size: 15px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); z-index: 60;
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; max-width: calc(100% - 32px); text-align: center; }

@media (prefers-reduced-motion: reduce) {
  .breath .orb { transition: none !important; }
  .ring .prog { transition: none; }
}
</style>

  function tallySvg(n) {
    // one group of up to 5 strokes; 5th crosses the four
    const xs = [6, 16, 26, 36];
    let p = '';
    for (let i = 0; i < Math.min(n, 4); i++) p += `<path d="M${xs[i]} ${4 + (i % 2)} L${xs[i] + 1} 38"/>`;
    if (n >= 5) p += '<path d="M1 30 L42 10"/>';
    return `<svg viewBox="0 0 44 42" aria-hidden="true">${p}</svg>`;
  }

  function viewDesafio() {
    const now = new Date();
    const y = now.getFullYear(), m = now.getMonth();
    const daysIn = new Date(y, m + 1, 0).getDate();
    const monthName = now.toLocaleString('pt-BR', { month: 'long' });
    const relDays = new Set(S.relapses.map(r => dayKey(r.at)));
    const bibDays = new Set(Object.values(B().read).map(dayKey)), dvDays = new Set(Object.keys(B().devoLog));
    const todayK = dayKey(now), startK = dayKey(S.firstStart);
    let clean = 0, fails = 0;
    const cells = [];
    const offset = new Date(y, m, 1).getDay();
    for (let i = 0; i < offset; i++) cells.push('<span></span>');
    for (let d = 1; d <= daysIn; d++) {
      const k = dayKey(new Date(y, m, d));
      let cls = 'future';
      if (k > todayK) cls = 'future';
      else if (k < startK) cls = 'before';
      else if (relDays.has(k)) { cls = 'fail'; fails++; }
      else if (k === todayK) cls = 'today';
      else { cls = 'clean'; clean++; }
      cells.push(`<span class="d ${cls} ${bibDays.has(k) ? 'bib' : ''} ${dvDays.has(k) ? 'dv' : ''}">${d}</span>`);
    }
    const groups = [];
    for (let left = clean; left > 0; left -= 5) groups.push(tallySvg(Math.min(5, left)));
    const bib = bibleMonth(y, m, daysIn);
    const remaining = daysIn - now.getDate();
    return `
      <header class="top"><h1>Desafio de ${monthName}</h1></header>
      <p class="muted">Você aguenta o mês inteiro sem recair? Cada dia limpo vira um risco na parede.</p>

      <section class="card">

        <div class="legend"><span><i style="background:var(--gold)"></i>Limpo</span><span><i style="background:var(--danger)"></i>Recaída</span><span><i style="border:2px solid var(--gold)"></i>Hoje</span><span><i style="background:var(--fg);border-radius:50%;width:6px;height:6px;vertical-align:1px"></i>Leu a Bíblia</span><span><i style="background:var(--gold);border-radius:50%;width:6px;height:6px;vertical-align:1px"></i>Devocional</span></div>
      </section>
      <section class="stats">
        <div class="stat"><b>${clean}</b><span>Dias limpos no mês</span></div>
        <div class="stat"><b>${fails}</b><span>Recaídas no mês</span></div>
      </section>
      <section class="card">
        <div class="spread"><h2>Bíblia em ${monthName}</h2><a href="#biblia" class="chip" style="text-decoration:none;color:var(--fg)">Ler agora</a></div>
        <div class="stats">
          <div class="stat"><b>${bib.streak}</b><span>Dias seguidos com a Palavra</span></div>
          <div class="stat"><b>${bib.devoStreak}</b><span>Devocionais seguidos</span></div>
          <div class="stat"><b>${bib.days}</b><span>Dias com a Palavra no mês</span></div>
          <div class="stat"><b>${bib.devos}</b><span>Devocionais no mês</span></div>
          <div class="stat"><b>${bib.chapters}</b><span>Capítulos no mês</span></div>
          <div class="stat"><b>${Object.keys(B().devoLog).length}</b><span>Devocionais no total</span></div>
        </div>
        <p class="muted" style="font-size:12px">“Com a Palavra” conta os dias em que você leu um capítulo ou fez o devocional.</p>
        <span class="eyebrow">Capítulos lidos por dia</span>
        ${bibleChart(bib, daysIn, now.getDate())}

        <div class="spread"><h2>Devocionais de ${monthName}</h2><span class="tag">${bib.devos} ${bib.devos === 1 ? 'feito' : 'feitos'}</span></div>
        ${(() => {
          const ti = devoToday(), todayDone = devoDoneOn(ti, dayKey(now));
          const head = todayDone ? '' : `<button class="devo-row" data-devo="${ti}"><small>Hoje</small><span>${esc(DEVOS[ti][0])}</span><span class="tag" style="flex:none">Fazer agora</span></button>`;

          return `<div class="list">${head}${rows || (head ? '' : '')}</div>${rows ? '' : '<p class="muted" style="font-size:14px">Nenhum devocional concluído este mês ainda.</p>'}`;
        })()}
      </section>`;
  }
  function bibleMonth(y, m, daysIn) {
    const bb = B(), per = Array(daysIn + 1).fill(0), dv = Array(daysIn + 1).fill(false);
    const inMonth = iso => { const d = new Date(iso); return d.getFullYear() === y && d.getMonth() === m ? d.getDate() : 0; };
    Object.values(bb.read).forEach(iso => { const d = inMonth(iso); if (d) per[d]++; });
    const devoList = [];
    Object.entries(bb.devoLog).forEach(([k, i]) => { const [yy, mm, dd] = k.split('-').map(Number); if (yy === y && mm - 1 === m) { dv[dd] = true; devoList.push({ day: dd, i }); } });
    devoList.sort((a, b) => b.day - a.day);
    const devoDays = new Set(Object.keys(bb.devoLog));
    const allDays = new Set([...Object.values(bb.read).map(dayKey), ...devoDays]);
    let days = 0; for (let d = 1; d <= daysIn; d++) if (per[d] || dv[d]) days++;
    return { per, dv, days, streak: streakOf(allDays), devoStreak: streakOf(devoDays), devoList, chapters: per.reduce((a, b) => a + b, 0), devos: devoList.length };
  }
  function bibleChart(bib, daysIn, today) {
    const W = 340, H = 146, L = 22, R = 4, T = 10, Bm = 28, ph = H - T - Bm;
    const step = (W - L - R) / daysIn, bw = Math.max(3, step - 2);
    const mx = Math.max(4, ...bib.per);
    const top = Math.ceil(mx / 2) * 2, yv = v => T + ph - v / top * ph;
    let g = '';
    [0, top / 2, top].forEach(v => { g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${yv(v)}" y2="${yv(v)}"/><text class="axis" x="${L - 5}" y="${yv(v) + 3}" text-anchor="end">${v}</text>`; });
    const ticks = [1, 5, 10, 15, 20, 25, daysIn].filter((v, i, a) => a.indexOf(v) === i && !(v !== daysIn && daysIn - v < 3));
    ticks.forEach(d => { g += `<text class="axis" x="${L + (d - .5) * step}" y="${H - 6}" text-anchor="middle">${d}</text>`; });
    for (let d = 1; d <= daysIn; d++) {
      const x = L + (d - 1) * step + (step - bw) / 2, v = bib.per[d];
      g += `<rect class="hit" data-bar="${d}" x="${L + (d - 1) * step}" y="${T}" width="${step}" height="${ph + 8}"/>`;
      if (v) {
        const h = Math.max(4, v / top * ph), y0 = T + ph, r = Math.min(4, bw / 2);
        g += `<path class="bar-m ${d === today ? 'today' : ''}" d="M${x} ${y0}V${y0 - h + r}q0 -${r} ${r} -${r}h${bw - 2 * r}q${r} 0 ${r} ${r}V${y0}z"/>`;
      }
      if (bib.dv[d]) g += `<circle class="devo-dot" cx="${x + bw / 2}" cy="${T + ph + 5}" r="2.5"/>`;
    }
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Capítulos lidos por dia neste mês: ${bib.chapters} no total">${g}</svg>`;
  }
  function showBarTip(d) {
    const now = new Date(), daysIn = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
    const bib = bibleMonth(now.getFullYear(), now.getMonth(), daysIn), n = bib.per[d];
    const label = new Date(now.getFullYear(), now.getMonth(), d).toLocaleDateString('pt-BR', { weekday: 'short', day: 'numeric', month: 'short' });

    tip.innerHTML = `<b>${label}</b> · ${n} ${n === 1 ? 'capítulo' : 'capítulos'}${bib.dv[d] ? ' · devocional feito' : ''}`;
    document.querySelectorAll('.chart .sel').forEach(e => e.classList.remove('sel'));
    const h = document.querySelector(`.chart .hit[data-bar="${d}"]`); if (h && h.nextElementSibling && h.nextElementSibling.classList.contains('bar-m')) h.nextElementSibling.classList.add('sel');
  }
  document.addEventListener('click', e => { const h = e.target.closest && e.target.closest('.chart .hit'); if (h) showBarTip(+h.dataset.bar); });

    const items = ps.days[d];
    return `<div class="day-row">
      <div class="spread"><b>Dia ${d + 1}</b><span class="meta">${ps.dayDone(d) ? '<span class="tag win">Concluído</span>' : esc(fmtReads(items))}</span></div>
      ${open ? `<div class="reads">${items.map(([b, c], i) => `<button class="read-item ${ps.isDone(d, i) ? 'ok' : ''}" data-pr="${d}:${i}"><span class="box"></span><span>${BOOKS[b]} ${c}</span><span>${BMETA[b][c - 1]} vers.</span></button>`).join('')}</div>` : ''}
    </div>`;
  }
  function viewPlans() {
    const cur = B().plan;
    return `
      <button class="back" data-bnav="books">← Bíblia</button>
      <header class="top"><h1>Planos de leitura</h1></header>
      <p class="muted">Escolha um plano. Ao terminar um capítulo pelo plano, ele conta também no seu progresso da Bíblia.</p>
      <div class="list">${PLANS.map(p => `
        <article class="plan-card">
          <div class="spread"><span class="eyebrow">${esc(p.tag)}</span><span class="meta">${p.days} dias</span></div>
          <h3>${esc(p.name)}</h3>
          <p class="muted" style="font-size:14px">${esc(p.desc)}</p>
          ${cur && cur.id === p.id ? '<button class="btn" data-bnav="plan">Ver meu plano</button>' : `<button class="btn primary" data-pstart="${p.id}">Começar este plano</button>`}
        </article>`).join('')}</div>`;
  }
  function viewPlan() {
    const ps = planState();
    if (!ps) return viewPlans();
    const n = ps.days.length, ahead = ps.next - ps.expected, late = ps.expected - 1 - ps.next;
    const status = ps.next >= n ? 'Plano concluído! Glória a Deus.'
      : ahead > 0 ? `Adiantado ${ahead} ${ahead === 1 ? 'dia' : 'dias'}`
      : ahead === 0 ? 'Você está em dia. A leitura de hoje já foi feita.'
      : late > 0 ? `${late} ${late === 1 ? 'dia' : 'dias'} de atraso, sem culpa: continue de onde parou`
      : 'Você está em dia. Falta só a leitura de hoje.';
    const show = []; for (let d = ps.next; d < Math.min(n, ps.next + 7); d++) show.push(d);
    return `
      <button class="back" data-bnav="books">← Bíblia</button>
      <header class="top"><h1>${esc(ps.def.name)}</h1></header>
      <section class="card">
        <div class="spread"><span class="big-pct" style="font-size:34px">${ps.doneDays}<span class="muted" style="font-size:18px"> / ${n} dias</span></span></div>
        <div class="bar"><i style="width:${(ps.doneDays / n * 100).toFixed(1)}%"></i></div>
        <p class="muted" style="font-size:14px">${status}</p>
      </section>
      ${show.map((d, i) => `<section class="card">${dayBlock(ps, d, i === 0)}</section>`).join('')}
      <div class="row"><button class="btn ghost" data-bnav="plans">Trocar de plano</button><button class="btn danger" id="planStop">Parar plano</button></div>`;
  }

    ['Escolha hoje', [5, 24, 15, 15], 'Josué não deixou a decisão para depois: escolhei hoje a quem servireis. A pureza não se decide uma vez para sempre, mas a cada dia. Hoje é o único dia que você tem nas mãos. Escolha servir ao Senhor hoje.', 'Senhor, hoje eu escolho te servir, com a minha casa e a minha vida.', 'Diga em voz alta, de manhã: “Hoje eu escolho servir ao Senhor”.'],
    ['Esperança que não decepciona', [44, 5, 3, 5], 'A luta produz perseverança, a perseverança produz caráter, e o caráter produz esperança. Cada dia em que você resiste está formando algo em você. Nada desse esforço é desperdiçado nas mãos de Deus.', 'Senhor, usa esta luta para formar o meu caráter.', 'Olhe seu contador e lembre: cada dia é caráter sendo formado.'],

  function verseText(b, c, v1, v2) {
    if (!BIBLE) return null;
    let t = BIBLE[b][c - 1].slice(v1 - 1, v2).join(' ').replace(/^[A-ZÁÉ][a-záéíóúçã]{1,8}:(?=\S)/, '');
    if (b === 18 && v1 === 1) t = t.replace(/^Salmo[^:]{0,60}:\s*/, '');
    return t;
  }
  const refTxt = ([b, c, v1, v2]) => BOOKS[b] + ' ' + c + ':' + v1 + (v2 > v1 ? '–' + v2 : '');
  // Um devocional novo por dia, pela data (o envio de notificações usa a mesma conta).
  const devoToday = () => { const n = new Date(); return Math.floor(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) / DAY) % DEVOS.length; };
  function viewDevo() {
    const i = bv.devo ?? devoToday(), dv = DEVOS[i], [b, c, v1, v2] = dv[1];
    const txt = verseText(b, c, v1, v2); if (!txt && !bibleErr) loadBible();
    const done = i === devoToday() ? devoDoneOn(i, dayKey(new Date())) : !!(B().devo || {})[i];
    return `
      <button class="back" data-bnav="devos">← Devocionais</button>
      <span class="eyebrow">${i === devoToday() ? 'Devocional de hoje · ' : ''}${i + 1} de ${DEVOS.length}</span>
      <header class="top"><h1>${esc(dv[0])}</h1></header>
      <article class="card devo">
        <p class="verse">${txt ? '“' + esc(txt) + '”' : (bibleErr ? 'Não consegui carregar o versículo. Verifique a internet.' : 'Carregando o versículo…')}</p>
        ${!txt && bibleErr ? '<button class="btn" id="bibRetry">Tentar de novo</button>' : ''}
        <span class="ref">${refTxt(dv[1])}</span>
      </article>
      <article class="card devo"><h4>Reflexão</h4><p class="body">${esc(dv[2])}</p></article>
      <article class="card devo"><h4>Oração</h4><p class="body" style="font-family:var(--font-verse);font-style:italic">${esc(dv[3])}</p></article>
      <article class="card devo"><h4>Para hoje</h4><p class="body">${esc(dv[4])}</p></article>
      <div class="row">
        <button class="btn ${done ? 'ghost' : 'primary'}" id="devoDone">${done ? 'Concluído ✓' : 'Concluir devocional'}</button>
        <button class="btn" data-bopen="${b}:${c}">Ler ${BOOKS[b]} ${c} inteiro</button>
      </div>`;
  }
  function viewDevos() {
    const d = B().devo || {}, nd = Object.keys(d).length;
    return `
      <button class="back" data-bnav="books">← Bíblia</button>
      <header class="top"><h1>Devocionais</h1></header>
      <p class="muted">${DEVOS.length} devocionais sobre liberdade e pureza. Todo dia aparece um novo, conforme a data. Cada um tem uma passagem, uma reflexão, uma oração e um passo prático.</p>
      <div class="bar"><i style="width:${(nd / DEVOS.length * 100).toFixed(1)}%"></i></div>
      <p class="muted" style="font-size:13px">${nd} de ${DEVOS.length} concluídos</p>
      <div class="list">${DEVOS.map((dv, i) => `<button class="read-item ${d[i] ? 'ok' : ''}" data-devo="${i}"><span class="box"></span><span style="color:var(--fg)">${i + 1}. ${esc(dv[0])}</span><span>${refTxt(dv[1])}</span></button>`).join('')}</div>`;
  }
  function stepChapter(dir) {
    let b = bv.b, c = bv.c + dir;
    if (c < 1) { if (b === 0) return; b--; c = BMETA[b].length; }
    else if (c > BMETA[b].length) { if (b === 65) return; b++; c = 1; }
    openChapter(b, c);
  }

  // ---------- routing & render ----------
  const VIEWS = { inicio: viewInicio, desafio: viewDesafio, incentivo: viewIncentivo, biblia: viewBiblia, diario: viewDiario, perfil: viewPerfil };
  let tab = 'inicio';
  let skipRoute = false;
  function route() {
    if (skipRoute) { skipRoute = false; return; }
    if (location.hash === '#devocional') { bv = { mode: 'devo', devo: devoToday() }; tab = 'biblia'; render(); return window.scrollTo(0, 0); }
    if (location.hash === '#biblia' && tab !== 'biblia') bv = { ...bv, mode: 'books' };
    const h = location.hash.replace('#', '');
    tab = VIEWS[h] ? h : 'inicio';
    render();
    window.scrollTo(0, 0);
  }
  function render() {
    $('#app').innerHTML = VIEWS[tab]();
    document.querySelectorAll('nav.tabs a').forEach(a => a.setAttribute('aria-current', a.dataset.tab === tab ? 'page' : 'false'));
    if (tab === 'perfil') $('#bkOut').value = JSON.stringify(S);
    tick();
  }
  function tick() {
    if (tab !== 'inicio') return;
    const el = $('#days'); if (!el) return;
    const ms = Math.max(0, Date.now() - currentStart());
    const d = Math.floor(ms / DAY);
    const rest = ms - d * DAY;
    el.textContent = d;
    $('#clock').textContent = pad(Math.floor(rest / 3600000)) + ':' + pad(Math.floor(rest / 60000) % 60) + ':' + pad(Math.floor(rest / 1000) % 60);
    const mi = milestoneInfo(ms);
    $('#ringProg').setAttribute('stroke-dashoffset', (552.92 * (1 - mi.pct)).toFixed(2));
    const left = mi.next[0] * DAY - ms;
    const ld = Math.floor(left / DAY), lh = Math.floor((left % DAY) / 3600000);
    $('#nextMs').innerHTML = `Próximo marco: <b>${esc(mi.next[1])}</b> · faltam ${ld > 0 ? ld + 'd ' : ''}${lh}h`;
  }
  setInterval(tick, 1000);

  // ---------- sheets ----------
  function openSheet(html, onMount) {
    $('#sheetHost').innerHTML = `<div class="overlay" id="ov"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
    $('#ov').addEventListener('click', e => { if (e.target.id === 'ov') closeSheet(); });
    onMount && onMount($('#ov'));
  }
  function closeSheet() { $('#sheetHost').innerHTML = ''; }

  function relapseSheet() {
    const sel = [];
    openSheet(`
      <h2>Registrar recaída</h2>
      <p class="muted">Cair não apaga o caminho que você já andou. Registre com sinceridade e levante.</p>
      <label class="eyebrow" for="rlAt">Quando aconteceu</label>
      <input type="datetime-local" id="rlAt" value="${toLocalInput(new Date())}" max="${toLocalInput(new Date())}">
      <span class="eyebrow">O que levou a isso?</span>
      <div class="row">${TRIGGERS.map(t => `<button class="chip" data-rt="${t}" aria-pressed="false">${t}</button>`).join('')}</div>
      <textarea id="rlNote" placeholder="O que você aprendeu? O que vai fazer diferente?"></textarea>
      <button class="btn danger block" id="rlSave">Registrar e recomeçar</button>
      <button class="btn ghost block" id="rlCancel">Cancelar</button>`, ov => {
      ov.querySelectorAll('[data-rt]').forEach(b => b.onclick = () => {
        const t = b.dataset.rt, i = sel.indexOf(t);
        i >= 0 ? sel.splice(i, 1) : sel.push(t);
        b.setAttribute('aria-pressed', i < 0);
      });
      $('#rlCancel').onclick = closeSheet;
      $('#rlSave').onclick = () => {
        const v = $('#rlAt').value;
        let at = v ? new Date(v) : new Date();
        if (isNaN(at) || at > new Date()) at = new Date();
        S.relapses.push({ id: uid(), at: at.toISOString(), triggers: sel, note: $('#rlNote').value.trim() });
        S.onboarded = true;
        save();
        const g = GRACE[Math.floor(Math.random() * GRACE.length)];
        openSheet(`
          <h2>Recomeço</h2>
          <p class="verse">“${esc(g[0])}”</p><span class="ref">${esc(g[1])}</span>
          <p class="muted">Seu contador recomeçou. O próximo risco na parede é amanhã.</p>
          <button class="btn primary block" id="okGrace">Seguir em frente</button>`, () => { $('#okGrace').onclick = () => { closeSheet(); render(); }; });
      };
    });
  }

  function confirmSheet(title, text, label, fn) {
    openSheet(`<h2>${esc(title)}</h2><p class="muted">${esc(text)}</p>
      <button class="btn danger block" id="cfOk">${esc(label)}</button>
      <button class="btn ghost block" id="cfNo">Cancelar</button>`, () => {
      $('#cfNo').onclick = closeSheet;
      $('#cfOk').onclick = () => { closeSheet(); fn(); };
    });
  }

  // ---------- SOS ----------
  let sosTimers = [];
  function openSOS() {
    const v = VERSES[Math.floor(Math.random() * 13)];
    const opened = Date.now();
    $('#sosHost').innerHTML = `
      <div class="sos" role="dialog" aria-modal="true" aria-label="Botão de pânico">
        <div class="wrap">
          <div class="spread"><h1>Respire. Isso vai passar.</h1></div>
          <p class="muted">A vontade costuma perder força em 10 a 15 minutos. Fique aqui, siga a respiração e faça um passo da lista.</p>
          <div class="breath"><div class="orb" id="orb"><span id="orbTxt">Inspire</span></div></div>
          <p class="timer" id="sosTimer">00:00 aqui dentro</p>
          <section class="card"><p class="verse">“${esc(v[0])}”</p><span class="ref">${esc(v[1])}</span></section>
          <section class="card"><h3>Lembre-se por que você começou</h3>
            <div class="list">${S.reasons.map(r => `<p>• ${esc(r)}</p>`).join('') || '<p class="muted">Adicione seus motivos no Perfil.</p>'}</div></section>
          <section class="steps"><h3>Faça agora</h3>${SOS_STEPS.map(s => `<button class="step" aria-pressed="false"><span class="box"></span><span>${esc(s)}</span></button>`).join('')}</section>
          <button class="btn primary block" id="sosWin">Venci a tentação</button>
          <button class="btn ghost block" id="sosClose">Fechar</button>
        </div>
      </div>`;
    document.body.style.overflow = 'hidden';
    document.querySelectorAll('.step').forEach(b => b.onclick = () => b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true'));
    $('#sosClose').onclick = closeSOS;
    $('#sosWin').onclick = () => {
      S.victories.push({ id: uid(), at: new Date().toISOString() });
      save(); closeSOS(); render(); toast('Vitória registrada. Deus é fiel.');
    };
    const phases = [['Inspire', 4, .95], ['Segure', 4, .95], ['Expire', 6, .62]];
    let i = 0;
    const orb = $('#orb'), txt = $('#orbTxt');
    const step = () => {
      if (!orb.isConnected) return;
      const [label, secs, scale] = phases[i % 3];
      txt.textContent = label;
      orb.style.transitionDuration = secs + 's';
      orb.style.transform = 'scale(' + scale + ')';
      i++;
      sosTimers.push(setTimeout(step, secs * 1000));
    };
    sosTimers.push(setTimeout(step, 60));
    const clock = setInterval(() => {
      const el = $('#sosTimer'); if (!el) return;
      const s = Math.floor((Date.now() - opened) / 1000);
      el.textContent = pad(Math.floor(s / 60)) + ':' + pad(s % 60) + ' aqui dentro';
    }, 1000);
    sosTimers.push(clock);
  }
  function closeSOS() {
    sosTimers.forEach(t => { clearTimeout(t); clearInterval(t); });
    sosTimers = [];
    $('#sosHost').innerHTML = '';
    document.body.style.overflow = '';
  }

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  // ---------- events (delegated) ----------
  document.addEventListener('click', e => {
    const t = e.target.closest('button');
    if (!t || !$('#app').contains(t)) return;
    const id = t.id;
    if (id === 'sosBtn') return openSOS();
    if (id === 'relapseBtn') return relapseSheet();
    if (id === 'onbSave') {
      const d = new Date($('#onbDate').value);
      if (!isNaN(d) && d <= new Date()) S.firstStart = d.toISOString();
      S.onboarded = true; save(); render(); return toast('Data salva');
    }
    if (id === 'onbSkip') { S.onboarded = true; S.firstStart = new Date().toISOString(); save(); return render(); }
    if (t.dataset.mood) { S.checkins[dayKey(new Date())] = t.dataset.mood; save(); return render(); }
    if (t.dataset.jmood) { draft.mood = draft.mood === t.dataset.jmood ? null : t.dataset.jmood; return keepText(render); }
    if (t.dataset.jtrig) {
      const i = draft.triggers.indexOf(t.dataset.jtrig);
      i >= 0 ? draft.triggers.splice(i, 1) : draft.triggers.push(t.dataset.jtrig);
      return keepText(render);
    }
    if (id === 'jSave') {
      const text = $('#jText').value.trim();
      if (!text && !draft.mood) return toast('Escreva algo ou escolha um humor');
      S.journal.push({ id: uid(), at: new Date().toISOString(), text, mood: draft.mood, triggers: draft.triggers.slice() });
      draft = { mood: null, triggers: [] }; save(); render(); return toast('Salvo no diário');
    }
    if (t.dataset.del) {
      const [kind, did] = t.dataset.del.split(':');
      const list = kind === 'relapse' ? 'relapses' : kind === 'win' ? 'victories' : 'journal';
      return confirmSheet('Apagar registro?', kind === 'relapse' ? 'Apagar esta recaída muda o seu contador e o desafio do mês.' : 'Esta entrada será removida.', 'Apagar', () => {
        S[list] = S[list].filter(x => x.id !== did); save(); render();
      });
    }
    if (t.dataset.bnav) { bv = { ...bv, mode: t.dataset.bnav }; render(); return window.scrollTo(0, 0); }
    if (t.dataset.bk) { bv = { mode: 'chapters', b: +t.dataset.bk, c: 1 }; render(); return window.scrollTo(0, 0); }
    if (t.dataset.bch) return openChapter(bv.b, +t.dataset.bch);
    if (id === 'bibCont') { const l = B().last; return l ? openChapter(l[0], l[1]) : openChapter(42, 1); }
    if (id === 'bibPrev') return stepChapter(-1);
    if (id === 'bibNext') return stepChapter(1);
    if (id === 'bibRetry') { loadBible(); return render(); }
    if (t.dataset.pstart) {
      const go = () => { B().plan = { id: t.dataset.pstart, start: new Date().toISOString(), done: {} }; bv = { mode: 'plan' }; save(); render(); window.scrollTo(0, 0); toast('Plano iniciado'); };
      return B().plan ? confirmSheet('Trocar de plano?', 'O progresso do plano atual será perdido. Os capítulos lidos continuam contando na Bíblia.', 'Trocar', go) : go();
    }
    if (id === 'planStop') return confirmSheet('Parar o plano?', 'O progresso deste plano será apagado. Os capítulos lidos continuam contando na Bíblia.', 'Parar plano', () => { B().plan = null; bv = { mode: 'books' }; save(); render(); });
    if (t.dataset.pr) {
      const [d, i] = t.dataset.pr.split(':').map(Number), ps = planState();
      const [b, c] = ps.days[d][i];
      return openChapter(b, c, { d, i });
    }
    if (id === 'planRead') {
      const ps = planState(), { d, i } = bv.ctx;
      ps.pl.done[d + ':' + i] = new Date().toISOString();
      B().read[bv.b + ':' + bv.c] = B().read[bv.b + ':' + bv.c] || new Date().toISOString();
      save();
      const ni = ps.days[d].findIndex((_, k) => !ps.isDone(d, k));
      if (ni >= 0) { const [b, c] = ps.days[d][ni]; return openChapter(b, c, { d, i: ni }); }
      toast('Dia ' + (d + 1) + ' concluído!'); bv = { mode: 'plan' }; render(); return window.scrollTo(0, 0);
    }
    if (t.dataset.devo) {
      bv = { mode: 'devo', devo: +t.dataset.devo };
      if (tab !== 'biblia') { tab = 'biblia'; skipRoute = true; location.hash = '#biblia'; }
      render(); return window.scrollTo(0, 0);
    }
    if (id === 'devoDone') {
      const bb = B(), dd = bb.devo || (bb.devo = {}), lg = bb.devoLog, i = bv.devo ?? devoToday(), k = dayKey(new Date());
      const isToday = i === devoToday(), done = isToday ? lg[k] === i : !!dd[i];
      if (done) {
        if (lg[k] === i) delete lg[k];
        if (!isToday || (dd[i] && dayKey(dd[i]) === k)) delete dd[i];
      } else {
        lg[k] = i; dd[i] = new Date().toISOString();
        const st = streakOf(new Set(Object.keys(lg)));
        toast('Devocional concluído' + (st > 1 ? ` · ${st} dias seguidos` : ''));
      }
      save(); return render();
    }
    if (t.dataset.bopen) { const [b, c] = t.dataset.bopen.split(':').map(Number); return openChapter(b, c); }
    if (id === 'bibRead') {
      const k = bv.b + ':' + bv.c, rd = B().read;
      if (rd[k]) { delete rd[k]; save(); return render(); }
      rd[k] = new Date().toISOString(); save();
      const st = bibleStats();
      toast(BOOKS[bv.b] + ' ' + bv.c + ' lido · ' + pctTxt(st.pct) + ' da Bíblia');
      if (bv.b < 65 || bv.c < BMETA[bv.b].length) return stepChapter(1);
      return render();
    }
    if (t.dataset.mgo) { const [b, c] = t.dataset.mgo.split(':').map(Number); return openChapter(b, c); }
    if (t.dataset.mdel) { delete B().marks[t.dataset.mdel]; save(); return render(); }
    if (id === 'dailyBtn') {
      const k = dayKey(new Date());
      if (S.dailyDone[k]) delete S.dailyDone[k]; else { S.dailyDone[k] = true; toast('Desafio cumprido. Continue assim!'); }
      save(); return render();
    }
    if (t.dataset.rf) { rFilter = t.dataset.rf; return render(); }
    if (t.dataset.seen) { const k = t.dataset.seen; if (S.seen[k]) delete S.seen[k]; else S.seen[k] = true; save(); return render(); }
    if (t.dataset.ldel) { S.links = S.links.filter(l => l.id !== t.dataset.ldel); save(); return render(); }
    if (id === 'lAdd') {
      const title = $('#lTitle').value.trim(), url = $('#lUrl').value.trim();
      if (!/^https?:\/\/\S+$/i.test(url)) return toast('Cole um link começando com https://');
      S.links.push({ id: uid(), title: title || url, url }); save(); render(); return toast('Link salvo');
    }
    if (t.dataset.rdel) { S.reasons.splice(+t.dataset.rdel, 1); save(); return render(); }
    if (id === 'rAdd') { const v = $('#rNew').value.trim(); if (v) { S.reasons.push(v); save(); render(); } return; }
    if (id === 'startSave') {
      const d = new Date($('#startEdit').value);
      if (isNaN(d) || d > new Date()) return toast('Escolha uma data que já passou');
      S.firstStart = d.toISOString(); S.onboarded = true; save(); render(); return toast('Início atualizado');
    }
    if (id === 'pushOn') { pushEnable(); return; }
    if (id === 'pushTest') { pushTest(); return; }
    if (id === 'pushCopy') {
      const ta = $('#pushCode');
      try { navigator.clipboard.writeText(ta.value).then(() => toast('Código copiado'), () => { ta.select(); toast('Selecionado. Copie manualmente.'); }); }
      catch (err) { ta.select(); toast('Selecionado. Copie manualmente.'); }
      return;
    }
    if (id === 'syncNow') { if (CLOUD.ref) cloudPull(false); return; }
    if (id === 'bkCopy') {
      const ta = $('#bkOut');
      const done = () => toast('Backup copiado');
      try { navigator.clipboard.writeText(ta.value).then(done, () => { ta.select(); toast('Selecionado. Copie manualmente.'); }); }
      catch (err) { ta.select(); toast('Selecionado. Copie manualmente.'); }
      return;
    }
    if (id === 'bkImport') {
      try {
        const s = JSON.parse($('#bkIn').value);
        if (!s || !s.firstStart || isNaN(new Date(s.firstStart))) throw 0;
        S = Object.assign(fresh(), s); S.onboarded = true; save(); render(); return toast('Backup restaurado');
      } catch (err) { return toast('Esse texto não é um backup válido'); }
    }
    if (id === 'wipe') {
      return confirmSheet('Apagar tudo?', 'Contador, diário, recaídas e motivos serão apagados deste aparelho. Não dá para desfazer.', 'Apagar tudo', () => {
        S = fresh(); save(); location.hash = '#inicio'; render();
      });
    }
  });
  document.addEventListener('click', e => {
    const v = e.target.closest('.reader .v');
    if (!v || !BIBLE) return;
    const n = +v.dataset.bv, k = bv.b + ':' + bv.c + ':' + n, mk = B().marks;
    if (mk[k]) { delete mk[k]; v.classList.remove('mk'); }
    else { mk[k] = { at: new Date().toISOString(), t: BIBLE[bv.b][bv.c - 1][n - 1] }; v.classList.add('mk'); toast(BOOKS[bv.b] + ' ' + bv.c + ':' + n + ' marcado'); }
    save();
  });
  function keepText(fn) { const v = $('#jText') ? $('#jText').value : ''; fn(); if ($('#jText')) $('#jText').value = v; }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if ($('#sosHost').innerHTML) closeSOS(); else closeSheet(); }
    if (e.key === 'Enter' && e.target.id === 'rNew') $('#rAdd').click();
  });
  window.addEventListener('hashchange', route);
  route();
  cloudInit();
})();
</script>

</body>
</html>
